# The same gate the pre-commit hook runs, where it cannot be skipped.
#
# The list itself lives in scripts/gate.sh — this file is only the part GitHub
# requires. Keeping the checks in YAML as well would mean two copies of the same
# list drifting apart, and the copy nobody runs is always the stale one.
#
# Browser checks (pnpm e2e) are NOT part of the gate: they need Clerk keys and a
# running server, and a red build for a missing secret teaches people to ignore
# red.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run's answer is
# already obsolete, and waiting for it delays the answer that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow.mjs reads the last commit subject, and a shallow clone has
          # no second commit to read it against.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/gate.sh --full
